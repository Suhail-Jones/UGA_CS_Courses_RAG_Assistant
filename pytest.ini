[pytest]
markers =
    prerequisites: tests related to course prerequisites
    admission: tests related to program admission
    exclusion: tests related to course exclusions
    metadata: tests checking course metadata
    gen_ed: tests for general education requirements
    double_dawgs: tests for the Double Dawgs program
    out_of_scope: tests for out of scope handling
    major_identity: tests for major specific identity questions
    multihop: tests requiring multihop reasoning
    comparison: tests comparing multiple courses/tracks
    course_content: tests about specific course syllabi/content